<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLOOP · คลังสอนงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F5F3EF;--surface:#fff;--ink:#1C1B19;--stone:#6E6A63;--faint:#A79F92;--hair:#E7E2DA;
    --navy:#1C1B19;--sage:#7C8B6F;--sageBg:#EAEFE4;--champ:#B8965A;--terra:#B05C38;--terraBg:#F7E7DE;--ok:#4E7C59;
    --sans:'Prompt',system-ui,sans-serif;--serif:'Poppins','Prompt',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:13.5px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  h1{font-family:var(--serif);font-size:20px;font-weight:700}
  .lead{color:var(--stone);font-size:13px;margin:4px 0 14px}
  .loading{color:var(--stone);text-align:center;padding:60px 0;font-family:var(--serif)}
  .err{color:#A32D2D;text-align:center;padding:40px 0;line-height:1.6}

  /* audience toggle */
  .aud{display:inline-flex;background:var(--surface);border:1px solid var(--hair);border-radius:20px;padding:3px;margin-bottom:16px}
  .aud button{border:none;background:none;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--stone);padding:7px 18px;border-radius:18px;cursor:pointer}
  .aud button.on{background:var(--ink);color:#fff}

  .grid{display:grid;grid-template-columns:260px 1fr;gap:16px}
  @media(max-width:680px){.grid{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px}
  .list .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .list .row:hover{background:var(--canvas)}
  .list .row.on{background:var(--navy);color:#fff}
  .list .row .ic{width:30px;height:30px;border-radius:9px;background:var(--sageBg);color:var(--sage);display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 auto}
  .list .row.on .ic{background:rgba(255,255,255,.15);color:#fff}
  .list .row .lb{font-size:13px;flex:1}
  .list .row .st{font-size:9px;padding:2px 7px;border-radius:20px}
  .st.pub{background:#E4F0E7;color:var(--ok)} .st.draft{background:#F1EADF;color:var(--champ)}
  .list .row.on .st{background:rgba(255,255,255,.2);color:#fff}
  .sechead{font-size:10.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;margin:12px 4px 4px;font-weight:600}

  label{display:block;font-size:11.5px;color:var(--stone);font-weight:600;margin:12px 2px 5px}
  input[type=text],textarea{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--canvas);border:1px solid var(--hair);border-radius:10px;padding:10px 12px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--navy)}
  .steps{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .step{background:var(--canvas);border:1px solid var(--hair);border-radius:12px;padding:12px}
  .step .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .step .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--serif)}
  .step .mv{margin-left:auto;display:flex;gap:4px}
  .btn-mini{border:1px solid var(--hair);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;color:var(--stone)}
  .btn-mini:hover{border-color:var(--navy);color:var(--ink)}
  .btn-mini.del:hover{border-color:#A32D2D;color:#A32D2D}
  .imgline{display:flex;align-items:center;gap:10px;margin-top:8px}
  .imgline .thumb{width:56px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--hair);background:#fff}
  .imgline .fchip{font-size:11.5px;color:var(--stone)}
  .filebtn{border:1px dashed var(--hair);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--stone)}
  .filebtn:hover{border-color:var(--navy);color:var(--ink)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
  .btn{border:none;border-radius:11px;padding:11px 20px;font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer}
  .btn.save{background:var(--ink);color:#fff}
  .btn.add{background:var(--sageBg);color:var(--sage)}
  .btn.del{background:none;color:#A32D2D;margin-left:auto}
  .pubrow{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;background:var(--terraBg);border-radius:12px}
  .pubrow .sw{position:relative;width:44px;height:24px;flex:0 0 auto}
  .pubrow input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .pubrow .track{position:absolute;inset:0;background:#D8CFC0;border-radius:20px;transition:.15s}
  .pubrow .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
  .pubrow input:checked ~ .track{background:var(--ok)}
  .pubrow input:checked ~ .knob{transform:translateX(20px)}
  .pubrow .txt{font-size:12.5px}.pubrow .txt b{font-weight:600}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{color:var(--faint);text-align:center;padding:50px 20px;font-size:13.5px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">กำลังเข้าสู่ระบบ…</div>
  <div id="main" style="display:none">
    <h1>คลังสอนงาน</h1>
    <div class="lead">เขียนวิธีใช้ + แนบรูปจริง — สลับได้ระหว่างคู่มือพนักงาน (หลังบ้าน) กับวิธีใช้สำหรับลูกค้า (หน้าบ้าน)</div>
    <div class="aud">
      <button id="aud_staff" class="on">พนักงาน (หลังบ้าน)</button>
      <button id="aud_customer">ลูกค้า (หน้าบ้าน)</button>
    </div>
    <div class="grid">
      <div class="card list" id="toollist"></div>
      <div class="card" id="editor"><div class="empty">เลือกจากรายการทางซ้ายเพื่อเขียน/แก้คู่มือ</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="ops-api.js"></script>
<script src="ops-menu.js"></script>
<script>
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// หน้าลูกค้า (liff) ที่ฝังปุ่ม "?" ไว้ — key = ชื่อไฟล์หน้า
const CUSTOMER_PAGES=[
  {section:'หน้าลูกค้า',href:'index.html',label:'หน้าแรก',icon:'⌂'},
  {section:'หน้าลูกค้า',href:'shop.html',label:'เช่าชุด / ร้านค้า',icon:'▦'},
  {section:'หน้าลูกค้า',href:'wish.html',label:'อยากได้ชุดไหน บอกเราได้',icon:'♡'},
  {section:'หน้าลูกค้า',href:'contract.html',label:'สัญญาเช่า',icon:'§'},
  {section:'หน้าลูกค้า',href:'review.html',label:'รีวิว',icon:'★'},
  {section:'หน้าลูกค้า',href:'quiz.html',label:'AI สไตลิสต์',icon:'✦'},
  {section:'หน้าลูกค้า',href:'looks.html',label:'Loop Looks',icon:'❤'},
];
// นิยามของแต่ละโหมด — RPC + ชื่อคีย์ที่ต่างกัน (tool vs page)
const MODES={
  staff:   {key:'tool', listFn:'sop_list',  upsertFn:'sop_upsert',  deleteFn:'sop_delete',  uploadFn:'sop_media_upload',  delArg:'p_tool'},
  customer:{key:'page', listFn:'help_list', upsertFn:'help_upsert', deleteFn:'help_delete', uploadFn:'help_media_upload', delArg:'p_page'},
};

let MODE='staff';
let ARTICLES={};   // keyValue -> row
let TOOLS=[];      // [{section,href,label,icon}]
let CUR=null, STEPS=[], curTitle='', curSummary='', curPublished=false;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),1800); }

function renderList(){
  const box=$('#toollist'); let html=''; let sec='';
  TOOLS.forEach(t=>{
    if(t.section!==sec){ sec=t.section; html+=`<div class="sechead">${esc(sec)}</div>`; }
    const a=ARTICLES[t.href];
    const badge=a?(a.published?'<span class="st pub">เผยแพร่</span>':'<span class="st draft">ร่าง</span>'):'';
    html+=`<div class="row${CUR===t.href?' on':''}" data-tool="${esc(t.href)}"><span class="ic">${esc(t.icon||'•')}</span><span class="lb">${esc(t.label)}</span>${badge}</div>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('.row').forEach(r=>r.addEventListener('click',()=>selectTool(r.getAttribute('data-tool'))));
}

function selectTool(tool){
  CUR=tool;
  const meta=TOOLS.find(t=>t.href===tool)||{};
  const a=ARTICLES[tool];
  curTitle=a&&a.title||meta.label||''; curSummary=a&&a.summary||''; curPublished=a&&a.published||false;
  STEPS=(a&&Array.isArray(a.steps)?a.steps:[]).map(s=>({text:s.text||'',image_path:s.image_path||'',_preview:''}));
  if(!STEPS.length) STEPS.push({text:'',image_path:'',_preview:''});
  renderList(); renderEditor();
}

function renderEditor(){
  const meta=TOOLS.find(t=>t.href===CUR)||{};
  const stepsHtml=STEPS.map((s,i)=>`
    <div class="step" data-i="${i}">
      <div class="top"><span class="n">${i+1}</span><span style="font-size:11.5px;color:var(--stone)">ขั้นที่ ${i+1}</span>
        <span class="mv"><button class="btn-mini" data-act="up" ${i===0?'disabled':''}>↑</button>
          <button class="btn-mini" data-act="down" ${i===STEPS.length-1?'disabled':''}>↓</button>
          <button class="btn-mini del" data-act="del">ลบ</button></span></div>
      <textarea rows="2" data-field="text" placeholder="อธิบายสั้น ๆ ว่าต้องทำอะไรในขั้นนี้">${esc(s.text)}</textarea>
      <div class="imgline">
        ${s._preview?`<img class="thumb" src="${esc(s._preview)}" alt="">`:(s.image_path?`<span class="fchip">แนบรูปแล้ว · เปลี่ยนได้</span>`:'')}
        <label class="filebtn">${s.image_path||s._preview?'เปลี่ยนรูป':'แนบรูป'}<input type="file" accept="image/*" data-act="img" hidden></label>
      </div>
    </div>`).join('');
  $('#editor').innerHTML=`
    <div style="font-size:11px;color:var(--faint);letter-spacing:1px">${esc(meta.section||'')} · ${esc(CUR)}</div>
    <label>ชื่อคู่มือ</label>
    <input type="text" id="f_title" value="${esc(curTitle)}" placeholder="เช่น วิธีเช่าชุด">
    <label>ทำอะไร (สรุปสั้น 1–2 บรรทัด)</label>
    <textarea id="f_summary" rows="2" placeholder="อธิบายสั้น ๆ ว่าหน้านี้ทำอะไร">${esc(curSummary)}</textarea>
    <label>ขั้นตอน</label>
    <div class="steps" id="steps">${stepsHtml}</div>
    <div class="toolbar"><button class="btn add" id="addStep">+ เพิ่มขั้นตอน</button></div>
    <div class="pubrow">
      <span class="sw"><input type="checkbox" id="f_pub" ${curPublished?'checked':''}><span class="track"></span><span class="knob"></span></span>
      <span class="txt"><b>${MODE==='staff'?'เผยแพร่ให้พนักงานเห็น':'เผยแพร่ให้ลูกค้าเห็น'}</b><br><span style="color:var(--stone)">ปิดไว้ = เป็นร่าง ปุ่ม “?” ยังไม่โผล่</span></span>
    </div>
    <div class="toolbar"><button class="btn save" id="saveBtn">บันทึก</button>
      ${ARTICLES[CUR]?'<button class="btn del" id="delBtn">ลบคู่มือ</button>':''}</div>`;
  bindEditor();
}

function syncFromForm(){
  curTitle=$('#f_title').value; curSummary=$('#f_summary').value; curPublished=$('#f_pub').checked;
  document.querySelectorAll('#steps .step').forEach(el=>{ STEPS[+el.getAttribute('data-i')].text=el.querySelector('[data-field=text]').value; });
}
function bindEditor(){
  $('#addStep').addEventListener('click',()=>{ syncFromForm(); STEPS.push({text:'',image_path:'',_preview:''}); renderEditor(); });
  $('#saveBtn').addEventListener('click',save);
  if($('#delBtn')) $('#delBtn').addEventListener('click',del);
  document.querySelectorAll('#steps .step').forEach(el=>{
    const i=+el.getAttribute('data-i');
    el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',ev=>{
      const act=b.getAttribute('data-act'); if(act==='img') return;
      ev.preventDefault(); syncFromForm();
      if(act==='del'){ STEPS.splice(i,1); if(!STEPS.length) STEPS.push({text:'',image_path:'',_preview:''}); }
      if(act==='up'&&i>0){ [STEPS[i-1],STEPS[i]]=[STEPS[i],STEPS[i-1]]; }
      if(act==='down'&&i<STEPS.length-1){ [STEPS[i+1],STEPS[i]]=[STEPS[i],STEPS[i+1]]; }
      renderEditor();
    }));
    const fi=el.querySelector('input[data-act=img]'); if(fi) fi.addEventListener('change',e=>uploadImg(e,i));
  });
}

function uploadImg(e,i){
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=async()=>{
    STEPS[i]._preview=reader.result; toast('กำลังอัปโหลดรูป…');
    const M=MODES[MODE], payload={image:reader.result,media_type:file.type}; payload[M.key]=CUR;
    try{
      const r=await window.opsRpc(M.uploadFn,payload);
      if(r&&r.data&&r.data.path){ STEPS[i].image_path=r.data.path; toast('อัปโหลดรูปแล้ว'); }
      else toast('อัปโหลดไม่สำเร็จ');
    }catch(err){ toast('อัปโหลดไม่สำเร็จ'); }
    syncFromForm(); renderEditor();
  };
  reader.readAsDataURL(file);
}

async function save(){
  syncFromForm();
  const M=MODES[MODE];
  const steps=STEPS.filter(s=>s.text||s.image_path).map((s,i)=>({n:i+1,text:s.text,image_path:s.image_path||undefined}));
  const p={title:curTitle,summary:curSummary,steps,published:curPublished}; p[M.key]=CUR;
  try{
    const r=await window.opsRpc(M.upsertFn,{p});
    const art=r&&r.data&&r.data.article;
    if(art){ ARTICLES[CUR]=art; toast('บันทึกแล้ว'); renderList(); }
    else toast('บันทึกไม่สำเร็จ');
  }catch(e){ toast('บันทึกไม่สำเร็จ — '+(e&&e.message||'')); }
}
async function del(){
  if(!confirm('ลบคู่มือของรายการนี้?')) return;
  const M=MODES[MODE], arg={}; arg[M.delArg]=CUR;
  try{ await window.opsRpc(M.deleteFn,arg); delete ARTICLES[CUR]; toast('ลบแล้ว'); selectTool(CUR); }
  catch(e){ toast('ลบไม่สำเร็จ'); }
}

async function loadMode(mode){
  MODE=mode; CUR=null; ARTICLES={}; TOOLS=[];
  $('#aud_staff').classList.toggle('on',mode==='staff');
  $('#aud_customer').classList.toggle('on',mode==='customer');
  $('#editor').innerHTML=`<div class="empty">เลือกจากรายการทางซ้ายเพื่อเขียน/แก้คู่มือ</div>`;
  if(mode==='staff'){
    const nav=window.opsVisibleNav('owner',true);
    nav.forEach(sec=>sec.items.forEach(it=>{ if(it.href!=='today.html') TOOLS.push({section:sec.section,href:it.href,label:it.label,icon:it.icon}); }));
  } else {
    TOOLS=CUSTOMER_PAGES.slice();
  }
  const M=MODES[mode];
  try{
    const r=await window.opsRpc(M.listFn,{});
    if(Array.isArray(r&&r.data)) r.data.forEach(a=>{ ARTICLES[a[M.key]]=a; });
  }catch(e){}
  renderList();
}

async function init(){
  let me;
  try{ me=await window.opsMe(); }
  catch(e){ $('#loading').className='err'; $('#loading').textContent='เข้าสู่ระบบไม่สำเร็จ — '+(e&&e.message||e); return; }
  if(me.is_owner!==true && me.role!=='manager'){
    $('#loading').className='err'; $('#loading').textContent='หน้านี้สำหรับเจ้าของและผู้จัดการเท่านั้น'; return;
  }
  $('#loading').style.display='none'; $('#main').style.display='block';
  $('#aud_staff').addEventListener('click',()=>loadMode('staff'));
  $('#aud_customer').addEventListener('click',()=>loadMode('customer'));
  await loadMode('staff');
  window.opsMenu.mount();
}
init();
</script>
<script src="ops-help.js?v=1"></script>
</body>
</html>
