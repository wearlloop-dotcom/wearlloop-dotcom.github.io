<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
.tile{width:800px;height:400px;background:#FBFAF8;display:block}
</style></head><body>
<script>
const INK='#1A1A1A', SAGE='#6FB3A6', SAGEBG='#E4F0EC', GOLD='#C9A86A', CLAY='#A75F3A', MUT='#8C8B86';
const S=`fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"`;
const SG=`fill="none" stroke="${SAGE}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"`;
const GD=`fill="none" stroke="${GOLD}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"`;
// ประกายดาว 4 แฉก (จุดตกแต่ง)
const spark=(x,y,r,c=GOLD)=>`<path d="M${x} ${y-r} L${x+r*0.28} ${y-r*0.28} L${x+r} ${y} L${x+r*0.28} ${y+r*0.28} L${x} ${y+r} L${x-r*0.28} ${y+r*0.28} L${x-r} ${y} L${x-r*0.28} ${y-r*0.28} Z" fill="${c}"/>`;
const blob=(x=400,y=205,rx=170,ry=145)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${SAGEBG}"/>`;
// เดรสสายเดี่ยวมินิมอล (จุดบนสุดของสาย x,y)
const dress=(x,y,sc=1,stroke=S)=>`<g transform="translate(${x},${y}) scale(${sc})">
  <path d="M-26 0 L-30 26 M26 0 L30 26" ${stroke}/>
  <path d="M-30 26 Q0 40 30 26 L34 66 Q0 76 -34 66 Z" ${stroke}/>
  <path d="M-34 66 L-58 150 Q0 172 58 150 L34 66" ${stroke}/></g>`;
// ไม้แขวน (ตะขอบน x,y)
const hanger=(x,y,sc=1,stroke=S)=>`<g transform="translate(${x},${y}) scale(${sc})">
  <path d="M0 0 Q16 0 16 -14 Q16 -28 0 -28" ${stroke}/>
  <path d="M0 0 L-70 34 L70 34 L0 0" ${stroke}/></g>`;
// ใบเสร็จ (มุมบนซ้าย x,y)
const receipt=(x,y,w=180,h=210)=>`<g transform="translate(${x},${y})">
  <path d="M0 0 H${w} V${h-16} L${w-w/6} ${h} L${w-w/3} ${h-16} L${w/2} ${h} L${w/3} ${h-16} L${w/6} ${h} L0 ${h-16} Z" fill="#fff" ${S.replace('fill="none" ','')}/>
  <line x1="28" y1="44" x2="${w-28}" y2="44" ${S}/><line x1="28" y1="80" x2="${w-28}" y2="80" ${S}/>
  <line x1="28" y1="116" x2="${w-60}" y2="116" ${S}/></g>`;
const check=(x,y,r=42)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${SAGE}"/>
  <path d="M${x-r*0.45} ${y} L${x-r*0.1} ${y+r*0.35} L${x+r*0.5} ${y-r*0.3}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>`;
const alert=(x,y,r=42,c=CLAY)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>
  <line x1="${x}" y1="${y-r*0.45}" x2="${x}" y2="${y+r*0.1}" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="${x}" cy="${y+r*0.42}" r="5.5" fill="#fff"/>`;
// กล่องพัสดุ (กึ่งกลางบน x,y)
const box=(x,y,w=200,h=120)=>`<g transform="translate(${x},${y})">
  <rect x="${-w/2}" y="0" width="${w}" height="${h}" rx="6" fill="#fff" ${S.replace('fill="none" ','')}/>
  <line x1="0" y1="0" x2="0" y2="${h}" ${S}/>
  <path d="M${-w/2} 0 L${-w/2-34} -34 M${w/2} 0 L${w/2+34} -34 M${-w/2-34} -34 L${-6} -34 M${w/2+34} -34 L${6} -34" ${S}/>
  <rect x="-22" y="${h*0.42}" width="44" height="26" rx="4" fill="${SAGEBG}" stroke="${SAGE}" stroke-width="4"/></g>`;

const ART = {
// 1 ต้อนรับ/KYC ผ่าน — เดรสบนไม้แขวน + เช็ค
welcome: blob()+hanger(400,96,0.9)+`<g transform="translate(400,128)">
  <path d="M-20 0 L-26 22 M20 0 L26 22" ${S}/>
  <path d="M-26 22 Q0 34 26 22 L32 62 Q0 72 -32 62 Z" ${S}/>
  <path d="M-32 62 Q-58 96 -84 148 Q0 178 84 148 Q58 96 32 62" ${S}/>
  <path d="M-30 100 Q0 112 30 100" ${SG}/></g>`+check(536,112)+spark(258,108,12)+spark(552,284,9,SAGE),
// 2 ยืนยันการจอง — ปฏิทิน + หัวใจบนวันที่
booking: blob()+`<rect x="280" y="110" width="240" height="200" rx="14" fill="#fff" ${S.replace('fill="none" ','')}/>
  <line x1="280" y1="162" x2="520" y2="162" ${S}/>
  <line x1="330" y1="86" x2="330" y2="128" ${S}/><line x1="470" y1="86" x2="470" y2="128" ${S}/>
  <circle cx="330" cy="196" r="6" fill="${MUT}"/><circle cx="400" cy="196" r="6" fill="${MUT}"/><circle cx="470" cy="196" r="6" fill="${MUT}"/>
  <circle cx="330" cy="248" r="6" fill="${MUT}"/><circle cx="470" cy="248" r="6" fill="${MUT}"/>
  <path d="M400 262 L382 244 Q372 232 382 222 Q392 214 400 224 Q408 214 418 222 Q428 232 418 244 Z" fill="${SAGE}"/>`
  +spark(556,120,11)+spark(248,286,9,SAGE),
// 3 ใกล้หมดเวลาชำระ — นาฬิกาทราย + ใบเสร็จ
'pay-clock': blob()+receipt(270,110,150,180)+`<g transform="translate(482,200)">
  <path d="M-52 -78 H52 M-52 78 H52 M-44 -78 Q-44 -18 0 0 Q44 -18 44 -78 M-44 78 Q-44 18 0 0 Q44 18 44 78" ${S}/>
  <path d="M-24 -66 Q-24 -30 0 -16 Q24 -30 24 -66 Z" fill="${GOLD}"/>
  <path d="M0 44 L0 58 M-14 66 Q0 56 14 66 L14 70 H-14 Z" fill="${GOLD}" stroke="${GOLD}" stroke-width="3"/></g>`+spark(266,320,9,SAGE),
// 4 ชำระเงินสำเร็จ — ใบเสร็จ + เช็ค
'payment-ok': blob()+receipt(310,96)+check(510,270)+spark(262,132,11)+spark(548,116,9,SAGE),
// 5 สลิปไม่ผ่าน — ใบเสร็จ + เครื่องหมายตกใจ
'slip-x': blob()+receipt(310,96)+alert(510,270)+spark(258,270,9,SAGE),
// 6 จัดส่งแล้ว — รถส่งของ + เส้นสปีด
shipped: blob(430,210)+`<g transform="translate(300,150)">
  <rect x="0" y="0" width="180" height="110" rx="10" fill="#fff" ${S.replace('fill="none" ','')}/>
  <path d="M180 34 H244 L272 72 V110 H180" fill="#fff" ${S}/>
  <line x1="196" y1="34" x2="196" y2="72" ${S}/><line x1="196" y1="72" x2="244" y2="72" ${S}/>
  <circle cx="52" cy="118" r="22" fill="${SAGEBG}" ${S}/><circle cx="224" cy="118" r="22" fill="${SAGEBG}" ${S}/>
  <rect x="30" y="26" width="86" height="52" rx="6" fill="${SAGEBG}" stroke="${SAGE}" stroke-width="4"/></g>
  <line x1="176" y1="196" x2="252" y2="196" ${SG}/><line x1="150" y1="230" x2="238" y2="230" ${SG}/><line x1="188" y1="264" x2="248" y2="264" ${SG}/>`,
// 7 เตือนคืน/กรอกเลขพัสดุ — กล่อง + ลูกศรวนกลับ
'return': blob()+box(430,168)+`<path d="M300 262 Q210 250 216 172 Q222 112 296 108" ${SG}/>
  <path d="M270 84 L300 108 L272 134" ${SG}/>`+spark(560,120,10),
// 8 รับเลขพัสดุแล้ว — กล่อง + เช็ค
'return-received': blob()+box(400,170)+check(524,140)+spark(258,140,10),
// 9 คืนสำเร็จ ขอรีวิว — เดรส + ประกาย + เช็ค
'qc-pass': blob()+dress(400,120)+check(516,128)+spark(276,120,13)+spark(300,290,9,SAGE)+spark(542,262,10),
// 10 พบตำหนิ มีค่าดูแล — แว่นขยายส่องผ้า
'qc-fee': blob()+`<rect x="270" y="140" width="180" height="140" rx="10" fill="#fff" ${S.replace('fill="none" ','')}/>
  <path d="M292 178 Q330 158 366 178 T428 178 M292 218 Q330 198 366 218 T428 218 M292 258 Q330 238 366 258 T428 258" ${GD}/>
  <circle cx="472" cy="176" r="62" fill="${SAGEBG}" fill-opacity="0.85" ${S}/>
  <line x1="516" y1="220" x2="560" y2="264" stroke="${INK}" stroke-width="12" stroke-linecap="round"/>
  <line x1="472" y1="152" x2="472" y2="184" stroke="${CLAY}" stroke-width="7" stroke-linecap="round"/><circle cx="472" cy="202" r="5.5" fill="${CLAY}"/>`,
// 11 คืนเงินแล้ว — แบงก์ + ลูกศรวน + เหรียญ
refund: blob()+`<rect x="300" y="150" width="200" height="110" rx="10" fill="#fff" ${S.replace('fill="none" ','')}/>
  <circle cx="400" cy="205" r="30" ${S}/><circle cx="336" cy="205" r="5" fill="${MUT}"/><circle cx="464" cy="205" r="5" fill="${MUT}"/>
  <circle cx="512" cy="140" r="26" fill="${GOLD}"/><circle cx="546" cy="170" r="18" fill="${SAGEBG}" stroke="${GOLD}" stroke-width="4"/>
  <path d="M282 268 Q236 246 244 196 Q250 158 288 146" ${SG}/><path d="M266 122 L292 144 L268 168" ${SG}/>`,
// 12 เลยกำหนดคืน — นาฬิกาปลุก + ตกใจ
overdue: blob()+`<g transform="translate(400,208)">
  <circle cx="0" cy="0" r="86" fill="#fff" ${S}/>
  <line x1="0" y1="0" x2="0" y2="-52" ${S}/><line x1="0" y1="0" x2="34" y2="18" ${S}/>
  <path d="M-56 -66 Q-84 -92 -62 -108 Q-44 -118 -34 -94" ${S}/>
  <path d="M56 -66 Q84 -92 62 -108 Q44 -118 34 -94" ${S}/>
  <line x1="-56" y1="76" x2="-68" y2="92" ${S}/><line x1="56" y1="76" x2="68" y2="92" ${S}/></g>`
  +alert(534,120)+`<path d="M258 150 L242 138 M252 190 L232 186" ${SG}/>`,
// 13 คิวว่างแล้ว — กระดิ่ง
queue: blob()+`<g transform="translate(400,196)">
  <path d="M0 -92 Q56 -92 60 -20 Q62 26 84 44 H-84 Q-62 26 -60 -20 Q-56 -92 0 -92" fill="#fff" ${S}/>
  <path d="M-20 44 Q-20 72 0 72 Q20 72 20 44" ${S}/>
  <line x1="0" y1="-92" x2="0" y2="-108" ${S}/>
  <path d="M-104 -44 Q-116 -20 -108 6 M104 -44 Q116 -20 108 6" ${SG}/></g>`+spark(536,110,12),
// 14 เครดิต — กระเป๋าเงิน + เหรียญ
credit: blob()+`<rect x="300" y="160" width="200" height="130" rx="16" fill="#fff" ${S.replace('fill="none" ','')}/>
  <path d="M300 190 Q300 150 340 150 H480" ${S}/>
  <rect x="448" y="204" width="70" height="44" rx="12" fill="${SAGEBG}" stroke="${SAGE}" stroke-width="4"/><circle cx="478" cy="226" r="7" fill="${SAGE}"/>
  <circle cx="356" cy="118" r="26" fill="${GOLD}"/><circle cx="404" cy="100" r="16" fill="${SAGEBG}" stroke="${GOLD}" stroke-width="4"/>`,
// 15 วันเกิด — เค้ก + เทียน
birthday: blob()+`<g transform="translate(400,180)">
  <rect x="-104" y="60" width="208" height="70" rx="10" fill="#fff" ${S}/>
  <rect x="-70" y="0" width="140" height="60" rx="10" fill="#fff" ${S}/>
  <path d="M-70 26 Q-52 44 -35 26 Q-18 44 0 26 Q18 44 35 26 Q52 44 70 26" ${SG}/>
  <path d="M-104 88 Q-86 106 -69 88 Q-52 106 -35 88 Q-17 106 0 88 Q17 106 35 88 Q52 106 69 88 Q86 106 104 88" ${SG}/>
  <line x1="0" y1="-38" x2="0" y2="0" stroke="${GOLD}" stroke-width="6" stroke-linecap="round"/>
  <path d="M0 -76 Q12 -58 0 -46 Q-12 -58 0 -76" fill="${GOLD}"/></g>`+spark(272,118,11)+spark(536,128,9,SAGE),
// 16 ผลวิเคราะห์สี — พัดสวอตช์ 4 โทน
style: blob()+`<g transform="translate(400,286)">
  <g transform="rotate(-42)"><rect x="-30" y="-186" width="60" height="150" rx="10" fill="${CLAY}"/></g>
  <g transform="rotate(-14)"><rect x="-30" y="-196" width="60" height="160" rx="10" fill="${GOLD}"/></g>
  <g transform="rotate(14)"><rect x="-30" y="-196" width="60" height="160" rx="10" fill="${SAGE}"/></g>
  <g transform="rotate(42)"><rect x="-30" y="-186" width="60" height="150" rx="10" fill="#fff" stroke="${SAGE}" stroke-width="4"/></g>
  <circle cx="0" cy="0" r="24" fill="#fff" ${S}/></g>`+spark(258,140,11)+spark(556,150,9,SAGE),
// 17 นัดสไตลิสต์ — ปฏิทิน + นาฬิกา
stylist: blob()+`<rect x="272" y="108" width="230" height="196" rx="14" fill="#fff" ${S.replace('fill="none" ','')}/>
  <line x1="272" y1="158" x2="502" y2="158" ${S}/>
  <line x1="320" y1="84" x2="320" y2="126" ${S}/><line x1="454" y1="84" x2="454" y2="126" ${S}/>
  <circle cx="322" cy="192" r="6" fill="${MUT}"/><circle cx="388" cy="192" r="6" fill="${MUT}"/><circle cx="322" cy="240" r="6" fill="${MUT}"/>
  <circle cx="484" cy="258" r="56" fill="${SAGEBG}" ${S}/>
  <line x1="484" y1="258" x2="484" y2="226" ${S}/><line x1="484" y1="258" x2="508" y2="270" ${S}/>`,
// 18 กลุ่ม/ชวนเพื่อน — เดรสคู่
group: blob()+hanger(324,116,0.8)+dress(324,148,0.78)+hanger(478,116,0.8)+
  `<g transform="translate(478,148) scale(0.78)"><path d="M-26 0 L-30 26 M26 0 L30 26" ${SG}/>
  <path d="M-30 26 Q0 40 30 26 L34 66 Q0 76 -34 66 Z" ${SG}/>
  <path d="M-34 66 L-58 150 Q0 172 58 150 L34 66" ${SG}/></g>`
  +spark(400,92,10)+spark(572,244,9,SAGE),
// 19 ผลประเมินซ่อม — เข็ม ด้าย กระดุม
repair: blob()+`<g transform="translate(400,200)">
  <line x1="-96" y1="72" x2="66" y2="-90" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="52" cy="-76" rx="14" ry="22" transform="rotate(45 52 -76)" fill="none" stroke="${INK}" stroke-width="6"/>
  <path d="M60 -84 Q150 -60 122 12 Q100 74 22 66 Q-40 60 -36 108" ${SG}/>
  <circle cx="-64" cy="-30" r="36" fill="#fff" ${S}/><circle cx="-64" cy="-30" r="22" ${S}/>
  <circle cx="-72" cy="-38" r="4.5" fill="${INK}"/><circle cx="-56" cy="-38" r="4.5" fill="${INK}"/>
  <circle cx="-72" cy="-22" r="4.5" fill="${INK}"/><circle cx="-56" cy="-22" r="4.5" fill="${INK}"/></g>`,
// 20 สัญญา — เอกสาร + ปากกา + ลายเซ็น
contract: blob()+`<path d="M300 96 H460 L500 136 V304 H300 Z" fill="#fff" ${S}/>
  <path d="M460 96 V136 H500" ${S}/>
  <line x1="330" y1="170" x2="470" y2="170" ${S}/><line x1="330" y1="206" x2="470" y2="206" ${S}/><line x1="330" y1="242" x2="410" y2="242" ${S}/>
  <path d="M330 278 Q352 262 368 278 Q384 292 404 276" ${SG}/>
  <g transform="translate(474,250) rotate(45)"><rect x="-9" y="-64" width="18" height="86" rx="6" fill="${GOLD}"/><path d="M-9 22 L0 44 L9 22 Z" fill="${INK}"/></g>`,
};
for (const [name, inner] of Object.entries(ART)) {
  const d=document.createElement('div'); d.className='tile'; d.id='tile-'+name;
  d.innerHTML=`<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="400" fill="#FBFAF8"/>${inner}</svg>`;
  document.body.appendChild(d);
}
</script></body></html>
