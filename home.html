<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLOOP · หลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#FAF8F5;--surface:#fff;--ink:#1C1B19;--stone:#6E6A63;--hair:#E7E2DA;
    --navy:#1C1B19;--sage:#D8C7A8;--sageDeep:#5E5746;--champ:#B8A179;--sageWash:#F4EEE1;--terra:#A75F3A;
    --sans:'Prompt',system-ui,sans-serif;
    --serif:'Poppins','Prompt',sans-serif;
    --serifth:'Prompt',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:13.5px;line-height:1.55}
  .bar{background:var(--surface);border-bottom:1px solid var(--hair);padding:12px 18px;display:flex;align-items:center;gap:10px}
  .bar .wm{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:3px}
  .bar .sm{font-size:11px;color:var(--stone);letter-spacing:2px;text-transform:uppercase}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:18px}

  /* ===== hero (เรียบ: ทักทาย + ตำแหน่ง + วันที่) ===== */
  .hero{background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:22px 22px}
  .hero .who{font-size:16px;color:var(--ink)}
  .hero .who b{font-weight:600}
  .hero .who .rl{display:inline-block;font-size:12px;color:#fff;background:var(--sageDeep);padding:2px 11px;border-radius:20px;margin-left:6px;letter-spacing:.5px;vertical-align:2px}
  .hero .dt{display:block;font-size:12.5px;color:var(--stone);margin-top:6px}
  .hero .tenure{display:block;font-size:12.5px;color:var(--champ);margin-top:8px;letter-spacing:.3px}
  .hero .tenure.anniv{font-family:var(--serifth);font-size:13.5px;font-weight:600}

  /* ===== impact (แถบสถิติสั้น) ===== */
  .impact{background:var(--sageWash);border:1px solid #E7DCC5;border-radius:3px;padding:16px 18px}
  .impact .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stat{text-align:center}
  .stat .n{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--terra);line-height:1}
  .stat .n small{font-size:11.5px;color:var(--stone)}
  .stat .l{font-size:11px;color:var(--stone);margin-top:5px;letter-spacing:.3px}
  .impact .cap{font-size:11.5px;color:var(--sageDeep);text-align:center;margin-top:12px;line-height:1.5}

  /* ===== tools ===== */
  .th-row{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -4px}
  .th-row h2{font-family:var(--serifth);font-size:14px;font-weight:600}
  .th-row .hint{font-size:12px;color:var(--stone)}
  .sec{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .sec > .t{font-size:11px;color:var(--stone);letter-spacing:2px;text-transform:uppercase;padding:0 2px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .tile{background:var(--surface);border:1px solid var(--hair);border-radius:3px;padding:11px 13px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;transition:.12s}
  .tile:hover{border-color:var(--navy)}
  .tile .ic{width:27px;height:27px;flex:0 0 auto;border-radius:50%;background:var(--canvas);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--sageDeep)}
  .tile .lb{font-weight:500;font-size:13px}
  .tile.primary{grid-column:1/-1;background:var(--navy);border-color:var(--navy);color:#fff;justify-content:center;padding:13px}
  .tile.primary .ic{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
  .tile.primary .lb{font-family:var(--serifth);font-size:14px;font-weight:600}
  @media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}

  .loading{color:var(--stone);text-align:center;padding:60px 0;font-family:var(--serifth)}
  .err{color:#A32D2D;text-align:center;padding:40px 0;line-height:1.6}
</style>
</head>
<body>
<div class="bar"><span class="wm">LLOOP</span><span class="sm">หลังบ้าน</span></div>
<div class="wrap">
  <div id="loading" class="loading">กำลังเข้าสู่ระบบ…</div>

  <div id="main" style="display:none;flex-direction:column;gap:18px">
    <!-- HERO -->
    <section class="hero">
      <div class="who">
        <span id="greet">สวัสดีค่ะ</span> <b id="nm">—</b><span class="rl" id="rl">—</span>
        <span class="dt" id="dt"></span>
        <span class="tenure" id="tenure" style="display:none"></span>
      </div>
    </section>

    <!-- IMPACT (แถบสั้น) -->
    <section class="impact">
      <div class="stats">
        <div class="stat"><div class="n" id="s_garments">—</div><div class="l">ชุดในระบบ</div></div>
        <div class="stat"><div class="n" id="s_loops">—</div><div class="l">หมุนเวียน (ครั้ง)</div></div>
        <div class="stat"><div class="n" id="s_water">—</div><div class="l">น้ำที่ช่วยประหยัด</div></div>
      </div>
      <div class="cap" id="cap">ทุกชุดที่คุณดูแลวันนี้ ช่วยให้โลกแบกขยะแฟชั่นน้อยลง</div>
    </section>

    <!-- TOOLS -->
    <div class="th-row"><h2>เครื่องมือของคุณ</h2><span class="hint" id="tools_hint"></span></div>
    <div id="sections" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="ops-api.js"></script>
<script src="ops-menu.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const TH_DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=(d)=>`วัน${TH_DOW[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543}`;
const fmt=(n)=>Math.round(n).toLocaleString('en-US');
function renderImpact(im){
  const g=im.garments_active||0, loops=im.loops_total||0;
  const perW=Number(im.eco_water_l||2700);
  const water=Number(im.water_l!=null?im.water_l:loops*perW);
  $('#s_garments').textContent=fmt(g);
  $('#s_loops').textContent=fmt(loops);
  $('#s_water').innerHTML = water>=1000000
    ? `${(water/1000000).toFixed(1)}<small> ล้านลิตร</small>`
    : `${fmt(water)}<small> ลิตร</small>`;
}

async function init(){
  let me;
  try{ me=await window.opsMe(); }
  catch(e){ $('#loading').className='err'; $('#loading').textContent='เข้าสู่ระบบไม่สำเร็จ — '+e.message; return; }

  const isOwner=me.is_owner===true;
  const role=me.role||(isOwner?'owner':'');
  const now=new Date(), hr=now.getHours();
  const greet = hr<12 ? 'อรุณสวัสดิ์ค่ะ' : hr<17 ? 'สวัสดีตอนบ่ายค่ะ' : hr<20 ? 'สวัสดีตอนเย็นค่ะ' : 'สวัสดียามค่ำค่ะ';
  $('#greet').textContent=greet;
  $('#nm').textContent=me.nickname||me.name||'พนักงาน';
  $('#rl').textContent=isOwner?'เจ้าของ':(window.opsRoleTH[role]||'พนักงาน');
  $('#dt').textContent=thDate(now);

  // เส้นทางของฉัน — ร่วมงานมากี่วัน / ครบรอบ
  window.opsRpc('ops_my_journey',{}).then(({data})=>{
    if(!data || data.tenure_days==null) return;
    const el=$('#tenure'); el.style.display='block';
    if(data.is_anniversary && data.anniversary_years>0){
      el.className='tenure anniv';
      el.textContent=`วันนี้ครบ ${data.anniversary_years} ปีที่ร่วมเดินทางกับ LLOOP — ขอบคุณที่อยู่ด้วยกันมาตลอดนะคะ`;
    } else {
      el.textContent=`ร่วมเดินทางกับ LLOOP มาแล้ว ${Number(data.tenure_days).toLocaleString('en-US')} วัน`;
    }
  }).catch(()=>{});

  // impact (ไม่บล็อกหน้า ถ้าพลาดก็ซ่อน)
  window.opsRpc('ops_impact',{}).then(({data})=>{ if(data) renderImpact(data); }).catch(()=>{});

  // tools ตาม role
  const nav=window.opsVisibleNav(role,isOwner);
  const box=$('#sections');
  box.innerHTML=`<a class="tile primary" href="today.html"><span class="ic">◷</span><span class="lb">เริ่มงานวันนี้</span></a>`;
  let count=0;
  for(const sec of nav){
    const items=sec.items.filter(it=>it.href!=='today.html');
    if(!items.length) continue;
    count+=items.length;
    const tiles=items.map(it=>`<a class="tile" href="${it.href}"><span class="ic">${it.icon||'•'}</span><span class="lb">${it.label}</span></a>`).join('');
    const el=document.createElement('div'); el.className='sec';
    el.innerHTML=`<div class="t">${sec.section}</div><div class="grid">${tiles}</div>`;
    box.appendChild(el);
  }
  $('#tools_hint').textContent=`${count} รายการสำหรับตำแหน่งคุณ`;

  $('#loading').style.display='none';
  $('#main').style.display='flex';
  window.opsMenu.mount();
}
init();
</script>
</body>
</html>
