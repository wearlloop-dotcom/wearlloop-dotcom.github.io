<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLOOP · หลังบ้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#F5F3EF;--surface:#fff;--ink:#1C1B19;--stone:#6E6A63;--faint:#A79F92;--hair:#E7E2DA;
    --navy:#1C1B19;--sage:#7C8B6F;--sageBg:#EAEFE4;--champ:#B8965A;--champBg:#F6EEDD;
    --terra:#B05C38;--terraBg:#F7E7DE;--ok:#4E7C59;
    --sans:'Prompt',system-ui,sans-serif;--serif:'Poppins','Prompt',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--canvas);font-size:13.5px;line-height:1.55}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
  .hd{margin-bottom:16px}
  .hd .g{font-size:20px;font-weight:600}.hd .g b{color:var(--terra)}
  .hd .g .rl{display:inline-block;font-size:11.5px;color:#fff;background:var(--sageDeep,#5E5746);background:var(--sage);padding:2px 11px;border-radius:20px;margin-left:6px;vertical-align:2px}
  .hd .d{color:var(--stone);font-size:12px;margin-top:3px}
  .hd .tenure{color:var(--champ);font-size:12px;margin-top:3px;display:none}

  /* banner เริ่มงาน */
  .banner{background:linear-gradient(120deg,#242019,#3a3428);color:#fff;border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:14px;text-decoration:none;margin-bottom:14px;position:relative;overflow:hidden}
  .banner .ring{position:absolute;width:150px;height:150px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-50px;top:-60px}
  .banner .ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}
  .banner .t{font-family:var(--serif);font-size:18px;font-weight:700}
  .banner .s{font-size:12px;color:rgba(255,255,255,.65)}
  .banner .arw{margin-left:auto;font-size:20px;opacity:.6}

  /* impact แถบเล็ก */
  .impact{display:flex;gap:8px;margin-bottom:6px}
  .impact .st{flex:1;background:var(--sageBg);border-radius:12px;padding:10px;text-align:center}
  .impact .st .n{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--terra);line-height:1}
  .impact .st .n small{font-size:10px;color:var(--stone)}
  .impact .st .l{font-size:10px;color:var(--stone);margin-top:4px}

  /* sections + app grid */
  .sect .t{font-size:12px;color:var(--stone);letter-spacing:1px;margin:20px 4px 12px;font-weight:600;display:flex;align-items:center;gap:7px}
  .sect .t .dot{width:8px;height:8px;border-radius:50%}
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
  @media(max-width:380px){.apps{grid-template-columns:repeat(3,1fr)}}
  .app{position:relative;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:7px}
  .app .ic{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 3px 8px rgba(0,0,0,.06);transition:.12s}
  .app:hover .ic{transform:translateY(-2px)}
  .app .lb{font-size:11px;text-align:center;line-height:1.2}
  .app.primary .ic{background:var(--navy);color:#fff}
  .help-btn{position:absolute;top:-4px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1px solid var(--hair);color:var(--stone);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .help-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .sage .ic{background:var(--sageBg);color:var(--sage)} .sage .dot{background:var(--sage)}
  .champ .ic{background:var(--champBg);color:var(--champ)} .champ .dot{background:var(--champ)}
  .terra .ic{background:var(--terraBg);color:var(--terra)} .terra .dot{background:var(--terra)}
  .navy .ic{background:#E7E2DA;color:var(--navy)} .navy .dot{background:var(--navy)}

  .loading{color:var(--stone);text-align:center;padding:60px 0;font-family:var(--serif)}
  .err{color:#A32D2D;text-align:center;padding:40px 0;line-height:1.6}

  /* ===== modal สอนงาน (bottom sheet) ===== */
  .scrim{position:fixed;inset:0;background:rgba(20,18,15,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:460px;background:var(--surface);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;z-index:41;transition:transform .24s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .sheet.on{transform:translateX(-50%) translateY(0)}
  .grip{width:40px;height:4px;border-radius:4px;background:#E0DAD0;margin:10px auto 4px}
  .sh-head{display:flex;align-items:center;gap:12px;padding:8px 20px 12px;position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--hair)}
  .sh-head .ic{width:38px;height:38px;border-radius:12px;background:var(--sageBg);color:var(--sage);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .sh-head .t{font-weight:600;font-size:16px}.sh-head .t small{display:block;font-size:11.5px;color:var(--stone);font-weight:400}
  .sh-head .x{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--canvas);color:var(--stone);border:none;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex:0 0 auto}
  .sh-body{padding:16px 20px 30px}
  .sh-body .what{font-size:13px;color:var(--stone);line-height:1.6;margin-bottom:18px}
  .sh-body .step{margin-bottom:20px}
  .sh-body .step .cap{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  .sh-body .step .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--serif);flex:0 0 auto}
  .sh-body .step .tx{font-size:13.5px;font-weight:500}
  .sh-body .shot{border-radius:14px;overflow:hidden;border:1px solid var(--hair);margin-top:2px}
  .sh-body .shot img{display:block;width:100%;height:auto}
  .sh-body .cta{display:block;text-align:center;background:var(--ink);color:#fff;border-radius:13px;padding:13px;text-decoration:none;font-weight:600;font-size:13.5px;margin-top:8px}
  .sh-body .empty{color:var(--stone);text-align:center;padding:30px 10px;font-size:13.5px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="loading">กำลังเข้าสู่ระบบ…</div>

  <div id="main" style="display:none">
    <div class="hd">
      <div class="g"><span id="greet">สวัสดีค่ะ</span> <b id="nm">—</b><span class="rl" id="rl">—</span></div>
      <div class="d" id="dt"></div>
      <div class="tenure" id="tenure"></div>
    </div>

    <a class="banner" href="today.html"><span class="ring"></span><span class="ic">◷</span>
      <span><span class="t">เริ่มงานวันนี้</span><br><span class="s" id="ban_sub">ดูงานค้าง + คิววันนี้</span></span>
      <span class="arw">→</span></a>

    <div class="impact" id="impact" style="display:none">
      <div class="st"><div class="n" id="s_garments">—</div><div class="l">ชุดในระบบ</div></div>
      <div class="st"><div class="n" id="s_loops">—</div><div class="l">หมุนเวียน</div></div>
      <div class="st"><div class="n" id="s_water">—</div><div class="l">น้ำที่ประหยัด</div></div>
    </div>

    <div id="sections"></div>
  </div>
</div>

<!-- modal สอนงาน -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh_title">
  <div class="grip"></div>
  <div class="sh-head"><span class="ic" id="sh_ic">?</span><span class="t" id="sh_title">—<small>วิธีใช้ · สอนงาน</small></span><button class="x" id="sh_close" aria-label="ปิด">×</button></div>
  <div class="sh-body" id="sh_body"></div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="config.js"></script>
<script src="ops-api.js"></script>
<script src="ops-menu.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TH_DOW=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=(d)=>`วัน${TH_DOW[d.getDay()]} ${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear()+543}`;
const fmt=(n)=>Math.round(n).toLocaleString('en-US');
const COLORS=['sage','champ','terra','navy'];  // สีไล่ตามลำดับหมวด

let SOP_SET=new Set();      // tool ที่มีคู่มือเผยแพร่แล้ว
let SOP_TITLE={};           // tool -> ไอคอน/label ไว้ขึ้นหัว modal

function renderImpact(im){
  const g=im.garments_active||0, loops=im.loops_total||0;
  const perW=Number(im.eco_water_l||2700);
  const water=Number(im.water_l!=null?im.water_l:loops*perW);
  $('#s_garments').textContent=fmt(g);
  $('#s_loops').textContent=fmt(loops);
  $('#s_water').innerHTML = water>=1000000 ? `${(water/1000000).toFixed(1)}<small> ล้านลิตร</small>` : `${fmt(water)}<small> ลิตร</small>`;
  $('#impact').style.display='flex';
}

/* ===== modal ===== */
function openSheet(){ $('#scrim').classList.add('on'); $('#sheet').classList.add('on'); document.body.style.overflow='hidden'; }
function closeSheet(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); document.body.style.overflow=''; }
$('#scrim').addEventListener('click',closeSheet);
$('#sh_close').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

async function showHelp(tool,icon,label){
  $('#sh_ic').textContent=icon||'?';
  $('#sh_title').innerHTML=`${esc(label||'')}<small>วิธีใช้ · สอนงาน</small>`;
  $('#sh_body').innerHTML=`<div class="empty">กำลังโหลดคู่มือ…</div>`;
  openSheet();
  let art=null;
  try{ const r=await window.opsRpc('sop_get',{tool}); art=r&&r.data; }catch(e){}
  if(!art){ $('#sh_body').innerHTML=`<div class="empty">ยังไม่มีคู่มือสำหรับเครื่องมือนี้<br>หัวหน้าเพิ่มได้ที่หน้า “คลังสอนงาน”</div>`; return; }
  const steps=Array.isArray(art.steps)?art.steps:[];
  let html='';
  if(art.summary) html+=`<div class="what">${esc(art.summary)}</div>`;
  steps.forEach((st,i)=>{
    html+=`<div class="step"><div class="cap"><span class="n">${st.n||i+1}</span><span class="tx">${esc(st.text||'')}</span></div>`;
    if(st.image_url) html+=`<div class="shot"><img src="${esc(st.image_url)}" alt="" loading="lazy"></div>`;
    html+=`</div>`;
  });
  html+=`<a class="cta" href="${esc(tool)}">เปิดเครื่องมือ →</a>`;
  $('#sh_body').innerHTML=html;
}

async function init(){
  let me;
  try{ me=await window.opsMe(); }
  catch(e){ $('#loading').className='err'; $('#loading').textContent='เข้าสู่ระบบไม่สำเร็จ — '+(e&&e.message||e); return; }

  const isOwner=me.is_owner===true;
  const role=me.role||(isOwner?'owner':'');
  const now=new Date(), hr=now.getHours();
  const greet = hr<12 ? 'อรุณสวัสดิ์ค่ะ' : hr<17 ? 'สวัสดีตอนบ่ายค่ะ' : hr<20 ? 'สวัสดีตอนเย็นค่ะ' : 'สวัสดียามค่ำค่ะ';
  $('#greet').textContent=greet;
  $('#nm').textContent=me.nickname||me.name||'พนักงาน';
  $('#rl').textContent=isOwner?'เจ้าของ':(window.opsRoleTH[role]||'พนักงาน');
  $('#dt').textContent=thDate(now);

  window.opsRpc('ops_my_journey',{}).then(({data})=>{
    if(!data || data.tenure_days==null) return;
    const el=$('#tenure'); el.style.display='block';
    el.textContent = (data.is_anniversary && data.anniversary_years>0)
      ? `วันนี้ครบ ${data.anniversary_years} ปีที่ร่วมเดินทางกับ LLOOP — ขอบคุณนะคะ`
      : `ร่วมเดินทางกับ LLOOP มาแล้ว ${Number(data.tenure_days).toLocaleString('en-US')} วัน`;
  }).catch(()=>{});

  window.opsRpc('ops_impact',{}).then(({data})=>{ if(data) renderImpact(data); }).catch(()=>{});

  // ดึงรายการเครื่องมือที่มีคู่มือแล้ว (โชว์ "?" เฉพาะที่มี)
  window.opsRpc('sop_get',{}).then(({data})=>{
    if(Array.isArray(data)){ data.forEach(x=>{ SOP_SET.add(x.tool); SOP_TITLE[x.tool]=x.title; }); renderHelpButtons(); }
  }).catch(()=>{});

  // เมนูตาม role
  const nav=window.opsVisibleNav(role,isOwner);
  const box=$('#sections'); box.innerHTML='';
  nav.forEach((sec,si)=>{
    const items=sec.items.filter(it=>it.href!=='today.html');
    if(!items.length) return;
    const color=COLORS[si % COLORS.length];
    const apps=items.map(it=>`
      <a class="app" href="${esc(it.href)}" data-tool="${esc(it.href)}" data-icon="${esc(it.icon||'•')}" data-label="${esc(it.label)}">
        <span class="ic">${esc(it.icon||'•')}</span><span class="lb">${esc(it.label)}</span>
      </a>`).join('');
    const el=document.createElement('div'); el.className='sect '+color;
    el.innerHTML=`<div class="t"><span class="dot"></span>${esc(sec.section)}</div><div class="apps">${apps}</div>`;
    box.appendChild(el);
  });

  $('#loading').style.display='none';
  $('#main').style.display='block';
  window.opsMenu.mount();
}

// วางปุ่ม "?" บนไอคอนที่มีคู่มือ (เรียกหลังโหลด sop list เสร็จ)
function renderHelpButtons(){
  document.querySelectorAll('.app[data-tool]').forEach(a=>{
    const tool=a.getAttribute('data-tool');
    if(!SOP_SET.has(tool) || a.querySelector('.help-btn')) return;
    const b=document.createElement('button');
    b.className='help-btn'; b.type='button'; b.textContent='?'; b.setAttribute('aria-label','วิธีใช้');
    b.addEventListener('click',ev=>{ ev.preventDefault(); ev.stopPropagation();
      showHelp(tool, a.getAttribute('data-icon'), a.getAttribute('data-label')); });
    a.appendChild(b);
  });
}
init();
</script>
</body>
</html>
